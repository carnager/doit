[package]
name = "doit"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
cosmic-text = "0.19.0"
fontdb = "0.23"
libc = "0.2.191"
memmap2 = "0.9"
nucleo-matcher = "0.3.1"
resvg = { version = "0.50.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smithay-client-toolkit = { version = "0.21", features = ["calloop"] }
tiny-skia = "0.12.0"
toml = "1.2.1"
zune-jpeg = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
